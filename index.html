<style>
/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  /* --u is the device's em size. The player fills the window: 22 x 34.6 em when stacked. */
  --u: min(94vw / 22, 88vh / 34.6);
  --pixel: "VT323", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: radial-gradient(circle at 50% 35%, #23262d 0%, #0d0e11 65%);
  color: #e8eaed; font-family: var(--sans);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: .18em solid #ffb000; outline-offset: .12em; }
.tip { position: fixed; left: 0; right: 0; bottom: 6px; margin: 0; font-size: 11px; color: #6d7380; text-align: center; padding: 0 1em; }

/* ---------- Device body ---------- */
.device {
  --b1: #eceef1; --b2: #b4b9c1; --wheel: #f8f8f9; --ink: #8b919b; --center: #dcdfe4;
  font-size: var(--u); width: 22em; padding: 1.3em 1.3em 2em; margin-bottom: 20px;
  border-radius: 2.2em; position: relative; user-select: none; -webkit-user-select: none;
  background: linear-gradient(160deg, var(--b1), var(--b2));
  box-shadow: 0 2.2em 4em rgba(0,0,0,.6), 0 .3em .8em rgba(0,0,0,.5),
              inset 0 .12em 0 rgba(255,255,255,.55), inset 0 -.25em .5em rgba(0,0,0,.28);
}
.device::before {                         /* glossy highlight */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 36%);
}

/* ---------- Screen ---------- */
.screen {
  position: relative; height: 14.6em; overflow: hidden; border-radius: .7em;
  border: .25em solid #17181b; color: #1b2430;
  background: linear-gradient(#f2f6f9, #dbe3ea);
}
.screen::after {                          /* LCD inner shadow + faint scanlines */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  box-shadow: inset 0 .25em .7em rgba(0,0,0,.35), inset 0 0 .2em rgba(0,0,0,.4);
  background: repeating-linear-gradient(rgba(0,0,0,.035) 0 1px, transparent 1px 3px);
}
.status {
  height: 1.4em; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .4em; padding: 0 .5em;
  font-family: var(--pixel); font-size: 1.15em; line-height: 1;
  background: linear-gradient(#fdfdfe, #c9d2db); border-bottom: 1px solid #98a3ae;
  position: relative; z-index: 2;
}
.st-l, .st-r { display: flex; align-items: center; gap: .35em; white-space: nowrap; }
.st-r { justify-content: flex-end; }
.st-l svg { width: .6em; height: .6em; fill: currentColor; }
.st-l small { font-size: .8em; letter-spacing: .02em; }
#title { min-width: 0; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.batt { width: 1.25em; height: .62em; border: 1px solid currentColor; border-radius: .1em; padding: 1px; position: relative; }
.batt::after { content: ""; position: absolute; right: -.18em; top: 22%; width: .12em; height: 56%; background: currentColor; }
.batt i { display: block; height: 100%; width: 100%; background: #3aa655; }

/* Views stack below the status bar and slide left/right */
#viewport { position: absolute; inset: 1.61em 0 0 0; }
.view { position: absolute; inset: 0; margin: 0; overflow: hidden; transition: transform .24s ease; background: inherit; }

/* Menus */
ul.menu { list-style: none; padding: 0; font-family: var(--pixel); font-size: 1.3em; line-height: 1.2; }
.menu li { display: flex; justify-content: space-between; gap: .5em; padding: 0 .45em; cursor: pointer; }
.menu li span:first-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.menu li .val { opacity: .7; white-space: nowrap; }
.menu li .chev { visibility: hidden; }
.menu li.sel { color: #fff; background: linear-gradient(#63adff, #1c5ccb); }
.menu li.sel .chev { visibility: visible; }
.menu li.sel .val { opacity: 1; }

/* Detail pages (scrolled by the wheel) */
.detail { padding: .6em .7em 1em; font-size: .84em; line-height: 1.4; overflow-y: auto; scrollbar-width: none; }
.detail::-webkit-scrollbar { display: none; }
.detail h2, .detail h3 { font-family: var(--pixel); font-weight: normal; margin: 0; line-height: 1.05; }
.detail h2 { font-size: 1.75em; }
.detail h3 { font-size: 1.4em; margin-top: .6em; color: #1c5ccb; }
.detail p { margin: .45em 0; }
.detail ul, .detail ol { margin: .4em 0; padding-left: 1.3em; }
.detail li { margin: .25em 0; }
.detail a { color: #1c5ccb; font-weight: 600; }
.detail .sub { color: #51606f; font-size: .92em; margin: .15em 0 0; }
.head { display: flex; gap: .7em; align-items: center; }
.head > div:last-child { min-width: 0; }
.hint { font-family: var(--pixel); font-size: 1.2em; color: #51606f; margin-top: .5em; }
.chips { display: flex; flex-wrap: wrap; gap: .3em; margin-top: .3em; }
.chips span { padding: .08em .5em; border: 1px solid #8fa0b1; border-radius: 1em; background: rgba(255,255,255,.6); }
.btn { display: inline-block; margin-top: .3em; padding: .2em .8em; border-radius: .3em; color: #fff !important; text-decoration: none; background: linear-gradient(#63adff, #1c5ccb); }

/* CSS album art */
.art {
  flex: none; width: 4.2em; height: 4.2em; border-radius: .3em; display: grid; place-items: center;
  font-family: var(--pixel); font-size: 1.25em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  background: linear-gradient(135deg, #ff8a5b, #8a43f0 55%, #1c5ccb) center / cover;
  box-shadow: 0 .1em .3em rgba(0,0,0,.35);
}
.art b { font-size: 1.9em; font-weight: normal; }

/* Equalizer bars */
.viz { display: flex; align-items: flex-end; gap: .2em; height: 3.4em; margin-top: .4em; border-bottom: 1px solid #8fa0b1; }
.viz i { flex: 1; height: 10%; background: linear-gradient(#63adff, #1c5ccb); }

/* Now Playing */
.now { padding: .5em .7em; }
.now .count { font-family: var(--pixel); font-size: 1.1em; color: #51606f; }
.now .head { margin-top: .3em; }
.now .t { font-family: var(--pixel); font-size: 1.65em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .t span { display: inline-block; }
.now .t.scroll { text-overflow: clip; }
.now .t.scroll span { animation: marquee 7s ease-in-out infinite alternate; }
@keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--shift)); } }
.now .a { font-size: .86em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .al { font-size: .78em; color: #51606f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: .7em; margin-top: .9em; border: 1px solid #5b6875; border-radius: .2em; background: #fff; position: relative; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(#63adff, #1c5ccb); }
.now.scrub .prog { outline: .12em solid #ffb000; }
.times { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 1.1em; }
.now .hint { font-size: 1.05em; margin-top: .2em; }
.now .bio { font-size: .8em; line-height: 1.35; margin: .6em 0 0; }
.now.about { overflow-y: auto; scrollbar-width: none; }
.now.about .a { white-space: normal; }
.now.about::-webkit-scrollbar { display: none; }

/* Volume / toast overlay */
#overlay {
  position: absolute; left: 50%; bottom: .7em; transform: translateX(-50%); z-index: 4;
  min-width: 9em; padding: .25em .7em .35em; border-radius: .4em; text-align: center;
  font-family: var(--pixel); font-size: 1.15em; color: #fff; background: rgba(20,26,34,.88);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
#overlay.show { opacity: 1; }
#overlay .bar { height: .35em; margin-top: .2em; background: rgba(255,255,255,.25); }
#overlay .bar i { display: block; height: 100%; background: #63adff; }

/* ---------- Click wheel ---------- */
.wheel {
  width: 15em; height: 15em; margin: 1.7em auto 0; border-radius: 50%; position: relative;
  background: var(--wheel); color: var(--ink); touch-action: none; cursor: grab;
  box-shadow: inset 0 .1em .3em rgba(0,0,0,.25), 0 .08em 0 rgba(255,255,255,.5);
}
.wheel:active { cursor: grabbing; }
.wheel button { position: absolute; display: grid; place-items: center; touch-action: none; }
.wheel .w { width: 4.4em; height: 3.2em; font-weight: 700; font-size: .9em; letter-spacing: .08em; border-radius: .6em; }
.wheel .w svg { width: 1.7em; height: .85em; fill: currentColor; }
#bMenu { top: .3em; left: 50%; transform: translateX(-50%); }
#bPlay { bottom: .3em; left: 50%; transform: translateX(-50%); }
#bPrev { left: .2em; top: 50%; transform: translateY(-50%); }
#bNext { right: .2em; top: 50%; transform: translateY(-50%); }
#bCenter {
  width: 5.8em; height: 5.8em; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(circle at 40% 30%, #fff8, transparent 60%), var(--center);
  box-shadow: 0 .05em .2em rgba(0,0,0,.4), inset 0 -.1em .3em rgba(0,0,0,.15);
}
#bCenter:active { filter: brightness(.92); }

/* Wide windows: screen on the left, wheel on the right (41 x 19 em) */
@media (min-aspect-ratio: 6/5) {
  body { --u: min(96vw / 41, 88vh / 19); }
  .device { width: 41em; padding: 1.5em; display: flex; align-items: center; gap: 2em; }
  .screen { flex: 1; height: 16em; }
  .wheel { flex: none; margin: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .view, #overlay { transition: none; }
  .now .t.scroll span { animation: none; }
  .now .t.scroll { text-overflow: ellipsis; }
}
</style>

/* Body colours for Settings > Theme */

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
/** Tiny DOM builder: h("div", {class:"x", text:"hi", onclick: fn}, child, [children]) */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in props || {}) {
    if (k === "class") e.className = props[k];
    else if (k === "text") e.textContent = props[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]);
    else e.setAttribute(k, props[k]);
  }
  for (const c of kids.flat(Infinity)) if (c != null) e.append(c);
  return e;
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const isUrl = u => /^(https?:\/\/|mailto:|\.{0,2}\/)/.test(u || "");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
// Routing <audio> through Web Audio mutes it on file:// and breaks iOS lock-screen playback,
// so the real analyser is only used on http(s) desktop/Android. Elsewhere the bars are simulated.
const CAN_ANALYSE = /^https?:$/.test(location.protocol) && !IOS;

/* Settings persist in localStorage when available */
const store = {
  get(k, d) { try { const v = localStorage.getItem("mp3_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mp3_" + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
};
const state = {
  theme: clamp(store.get("theme", 0), 0, THEMES.length - 1),
  clicks: store.get("clicks", true),
  shuffle: store.get("shuffle", false),
  repeat: store.get("repeat", "off"),          // off | all | one
  volume: clamp(store.get("volume", 0.8), 0, 1),
  cur: -1,                                     // playlist index, -1 = nothing played yet
  bad: false,                                  // current track failed to load
  fails: 0,                                    // consecutive load failures

};

const device = $("#device"), viewport = $("#viewport"), wheel = $("#wheel");
const audio = $("#audio"), ov = $("#overlay"), live = $("#live");
audio.volume = state.volume;

function say(t) { live.textContent = t; }
let ovTimer;
/** Toast / volume overlay that fades after 1.5s */
function overlay(text, level) {
  ov.textContent = "";
  ov.append(h("span", { text }));
  if (level != null) ov.append(h("div", { class: "bar" }, h("i", { style: `width:${Math.round(level * 100)}%` })));

  clearTimeout(ovTimer);
  ovTimer = setTimeout(() => ov.classList.remove("show"), 1500);
}
function applyTheme() {
  const t = THEMES[state.theme];
  for (const k of ["b1", "b2", "wheel", "ink", "center"]) device.style.setProperty("--" + k, t[k]);

/** Tell the backend something happened: "view", "project:<slug>" or "song:<slug>". Fails silently. */
function hit(key) {

/* =====================================================================
   Web Audio: click sound + analyser
   ===================================================================== */
let actx = null, analyser = null, freq = null, armed = false;
function getCtx() {
  if (!armed) return null;                     // never create audio before a user gesture
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
/** Short oscillator blip on each scroll tick */
function blip() {
  if (!state.clicks) return;
  const c = getCtx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = "square"; o.frequency.value = 1700;
  g.gain.setValueAtTime(0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.04);

/** Draw the top screen. dir: 1 = slide in from right, -1 = from left, 0 = redraw in place */

  viewport.append(el);

      el.getBoundingClientRect();              // force reflow so the transition runs
      el.style.transform = "";

  if (v.kind === "menu") syncSel();
  else say(v.title + ". " + el.textContent.slice(0, 300));

/* ---- Circular drag on the wheel (mouse + touch via pointer events) ---- */
const STEP = 30;                               // degrees per item, like a real click wheel
let drag = null, swallowClick = false;
function angle(e) {
  const r = wheel.getBoundingClientRect();
  const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
  return { deg: Math.atan2(y, x) * 180 / Math.PI, near: Math.hypot(x, y) < r.width * 0.12 };

wheel.addEventListener("pointerdown", e => {
  if (e.target.closest("#bCenter")) return;
  drag = { last: angle(e).deg, acc: 0, moved: false };
});
window.addEventListener("pointermove", e => {
  if (!drag) return;
  const a = angle(e);
  let d = a.deg - drag.last;
  if (d > 180) d -= 360; else if (d < -180) d += 360;
  drag.last = a.deg;
  if (a.near) return;                          // angles are unstable right at the hub
  drag.acc += d;
  while (Math.abs(drag.acc) >= STEP) {
    const dir = Math.sign(drag.acc);
    drag.acc -= dir * STEP; drag.moved = true;
    tick(dir);
  }
});

  if (drag && drag.moved) { swallowClick = true; setTimeout(() => { swallowClick = false; }, 80); }
  drag = null;
}

device.addEventListener("wheel", e => {

<style>
/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  --pixel: "VT323", "Courier New", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-family: var(--sans); overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: .15em solid #ffb000; outline-offset: .1em; }
[hidden] { display: none !important; }

/* ---------- The whole page is the player's screen ---------- */
.app {
  /* theme colours, overwritten from THEMES in JS */
  --bg1: #f2f6f9; --bg2: #dbe3ea; --ink: #1b2430; --acc1: #63adff; --acc2: #1c5ccb; --link: #1c5ccb;
  --dim: color-mix(in srgb, var(--ink) 62%, transparent);
  --line: color-mix(in srgb, var(--ink) 28%, transparent);
  --panel: linear-gradient(color-mix(in srgb, var(--bg1), #fff 12%), color-mix(in srgb, var(--bg2), #000 7%));
  height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative;
  font-size: clamp(15px, .75vw + 7px, 21px);
  color: var(--ink); background: linear-gradient(var(--bg1), var(--bg2));
}
.app::after {                                 /* faint LCD scanlines over everything */
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 9;
  background: repeating-linear-gradient(rgba(0,0,0,.03) 0 1px, transparent 1px 3px);
}

/* Status bar */
.status {
  flex: none; height: 1.9em; display: flex; justify-content: space-between; align-items: center; padding: 0 .6em;
  font-family: var(--pixel); font-size: 1.4em; line-height: 1; position: relative;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.st-l, .st-r { display: flex; align-items: center; gap: .5em; white-space: nowrap; }
.st-l svg { width: .6em; height: .6em; fill: currentColor; }
.st-l small { font-size: .8em; }
.status button { padding: .05em .45em; border: 1px solid var(--line); border-radius: .25em; }
.status button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
#title { position: absolute; left: 50%; transform: translateX(-50%); max-width: 40%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: default; }
.batt { width: 1.25em; height: .62em; border: 1px solid currentColor; border-radius: .1em; padding: 1px; position: relative; }
.batt::after { content: ""; position: absolute; right: -.18em; top: 22%; width: .12em; height: 56%; background: currentColor; }
.batt i { display: block; height: 100%; width: 100%; background: #3aa655; }

/* Body: menu column on the left, live preview on the right */
.body { flex: 1; min-height: 0; display: flex; }
.side { flex: 0 0 clamp(250px, 31vw, 430px); display: flex; flex-direction: column; border-right: 1px solid var(--line); }
#viewport { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.keys { flex: none; margin: 0; padding: .6em .9em; font-size: .72em; color: var(--dim); border-top: 1px solid var(--line); }
#pane { flex: 1; min-width: 0; overflow-y: auto; padding: 1.6em 2.2em; }
#pane > * { max-width: 46em; }
.view { position: absolute; inset: 0; margin: 0; overflow-y: auto; transition: transform .24s ease; }

/* Menus */
ul.menu { list-style: none; padding: .2em 0; font-family: var(--pixel); font-size: 1.75em; line-height: 1.25; }
.menu li { display: flex; justify-content: space-between; gap: .5em; padding: 0 .5em; cursor: pointer; }
.menu li span:first-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.menu li .val { opacity: .7; white-space: nowrap; }
.menu li .chev { visibility: hidden; }
.menu li.sel { color: #fff; background: linear-gradient(var(--acc1), var(--acc2)); }
.menu li.sel .chev { visibility: visible; }
.menu li.sel .val { opacity: 1; }
.menu li.group { font-family: var(--sans); font-size: .42em; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 1.1em 1.2em .3em; cursor: default; }

/* Content pages */
.detail { line-height: 1.5; }
.view.detail, .view.now { padding: 1em 1.1em 1.5em; }
.detail h2, .detail h3 { font-family: var(--pixel); font-weight: normal; margin: 0; line-height: 1.05; }
.detail h2 { font-size: 2.2em; }
.detail h3 { font-size: 1.6em; margin-top: .8em; color: var(--link); }
.detail p { margin: .5em 0; }
.detail ul, .detail ol { margin: .4em 0; padding-left: 1.3em; }
.detail li { margin: .25em 0; }
.detail a { color: var(--link); font-weight: 600; }
.detail .sub { color: var(--dim); font-size: .92em; margin: .15em 0 0; }
.head { display: flex; gap: .9em; align-items: center; }
.head > div:last-child { min-width: 0; }
.hint { font-family: var(--pixel); font-size: 1.25em; color: var(--dim); margin-top: .7em; }
.chips { display: flex; flex-wrap: wrap; gap: .35em; margin: .5em 0; font-size: .9em; }
.chips span { padding: .1em .6em; border: 1px solid var(--line); border-radius: 1em; background: color-mix(in srgb, var(--ink) 6%, transparent); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15em), 1fr)); gap: .8em; margin: .8em 0; }
.gallery figure { margin: 0; }
.gallery img, .gallery video { display: block; width: 100%; border-radius: .4em; border: 1px solid var(--line); background: #000; }
.gallery figcaption { font-size: .82em; color: var(--dim); margin-top: .25em; }
.btn { display: inline-block; margin: .4em .4em 0 0; padding: .3em .9em; border-radius: .3em; color: #fff !important; text-decoration: none; font-weight: 600; background: linear-gradient(var(--acc1), var(--acc2)); }
.rows { margin-top: .6em; }
.rows button { display: block; width: 100%; text-align: left; padding: .55em .7em; border-top: 1px solid var(--line); }
.rows button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.rows b { display: block; font-family: var(--pixel); font-weight: normal; font-size: 1.5em; line-height: 1.1; }
.rows small { color: var(--dim); }

/* CSS album art */
.art {
  flex: none; width: 4.2em; height: 4.2em; border-radius: .3em; display: grid; place-items: center;
  font-family: var(--pixel); font-size: 1.25em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  background: linear-gradient(135deg, #ff8a5b, #8a43f0 55%, #1c5ccb) center / cover;
  box-shadow: 0 .1em .3em rgba(0,0,0,.35);
}
.art b { font-size: 1.9em; font-weight: normal; }

/* Equalizer bars */
.viz { display: flex; align-items: flex-end; gap: .2em; height: 4em; margin-top: .4em; border-bottom: 1px solid var(--line); }
.viz i { flex: 1; height: 10%; background: linear-gradient(var(--acc1), var(--acc2)); }

/* Now Playing card */
.now { display: flex; flex-direction: column; }
#pane .now { min-height: 100%; font-size: 1.2em; }
.now > * { flex: none; }
.now .count { font-family: var(--pixel); font-size: 1.15em; color: var(--dim); }
.now .head { margin-top: .3em; }
.now .t { font-family: var(--pixel); font-size: 2em; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now .t span { display: inline-block; }
.now .t.scroll { text-overflow: clip; }
.now .t.scroll span { animation: marquee 7s ease-in-out infinite alternate; }
@keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--shift)); } }
.now .a { font-size: .9em; }
.now .al { font-size: .8em; color: var(--dim); }
.prog { height: .7em; margin-top: 1em; border: 1px solid var(--line); border-radius: .2em; background: color-mix(in srgb, var(--bg1), #fff 40%); }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(var(--acc1), var(--acc2)); }
.times { display: flex; justify-content: space-between; font-family: var(--pixel); font-size: 1.15em; }
.now .bio { font-size: .85em; line-height: 1.45; margin: .7em 0 0; }
.now .viz { height: 5em; margin-top: .8em; border: 0; }
#pane .now .viz { height: 9em; }

/* Transport bar */
.transport {
  flex: none; display: flex; align-items: center; gap: .7em; padding: .45em .8em;
  background: var(--panel); border-top: 1px solid var(--line); position: relative; z-index: 10;
}
.transport button { width: 2.3em; height: 2.3em; display: grid; place-items: center; border-radius: 50%; flex: none; }
.transport button:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.transport svg { width: 1.2em; height: 1.2em; fill: currentColor; }
#bPlay { color: #fff; background: linear-gradient(var(--acc1), var(--acc2)); }
#bPlay:hover { filter: brightness(1.08); background: linear-gradient(var(--acc1), var(--acc2)); }
#tpTitle { flex: 0 1 13em; min-width: 0; font-family: var(--pixel); font-size: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tpTime { font-family: var(--pixel); font-size: 1.2em; min-width: 2.6em; text-align: right; }
input[type=range] { accent-color: var(--acc2); height: 1.2em; margin: 0; min-width: 0; }
#tpSeek { flex: 1; }
#tpVol { flex: 0 0 6em; }

/* Volume / toast overlay */
#overlay {
  position: absolute; left: 50%; bottom: 4.6em; transform: translateX(-50%); z-index: 11;
  min-width: 9em; padding: .25em .8em .35em; border-radius: .4em; text-align: center;
  font-family: var(--pixel); font-size: 1.3em; color: #fff; background: rgba(20,26,34,.9);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
#overlay.show { opacity: 1; }
#overlay .bar { height: .35em; margin-top: .2em; background: rgba(255,255,255,.25); }
#overlay .bar i { display: block; height: 100%; background: var(--acc1); }

/* Narrow screens: one column, tapping an item opens it full width */
@media (max-width: 799px) {
  .side { flex: 1; border: 0; }
  #pane, .keys, #tpVol, #bPlain .w { display: none; }
  ul.menu { font-size: 2em; }
  #title { max-width: 34%; }
  #tpTitle { flex: 0 1 5em; }
  #tpSeek { min-width: 4em; }
}
@media (max-width: 479px) { #clock { display: none; } }

/* Plain view: the same content as an ordinary page */
#plainBar { display: none; }
body.plain { overflow: auto; background: #f6f7f9; color: #1b2430; }
body.plain .app { display: none; }
body.plain #plainBar { display: block; max-width: 44rem; margin: 0 auto; padding: 1.2rem 1.2rem 0; }
body.plain #plainBar button { padding: .4rem .9rem; border-radius: .3rem; color: #fff; font-weight: 600; background: #1c5ccb; }
body.plain #fallback { max-width: 44rem; margin: 0 auto; padding: .5rem 1.2rem 4rem; line-height: 1.6; }
body.plain #fallback h1 { font-size: 2rem; margin: 1rem 0 .3rem; }
body.plain #fallback h2 { margin: 2rem 0 .4rem; padding-bottom: .2rem; border-bottom: 1px solid #c9d1da; }
body.plain #fallback h3 { margin: 1.2rem 0 .1rem; }
body.plain #fallback a { color: #1c5ccb; }

@media (prefers-reduced-motion: reduce) {
  .view, #overlay { transition: none; }
  .now .t.scroll span { animation: none; }
  .now .t.scroll { text-overflow: ellipsis; }
}
</style>
</head>

let actx = null, analyser = null, freq = null, armed = false;

  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
  if (actx.state === "suspended") actx.resume();

}
/** Short oscillator blip on each menu move */

  o.type = "square"; o.frequency.value = 1700;
  g.gain.setValueAtTime(0.035, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.04);
}

function vizLoop(ts) {

  if (!bars.length) { vizOn = false; return; }
  const playing = !audio.paused;
  if (analyser && playing) {
    analyser.getByteFrequencyData(freq);
    bars.forEach((b, i) => { b.style.height = Math.max(6, freq[(i % 24) + 1] / 255 * 100) + "%"; });
  } else if (!REDUCED) {                       // simulated fallback
    const amp = playing ? 1 : 0.3;

const track = () => DATA.playlist[state.cur];

  const v = topView(), old = viewport.querySelector(".view.current");
  const el = RENDER[v.kind](v);
  el.classList.add("view", "current");
  v.el = el;
  viewport.append(el);
  if (old) {
    old.classList.remove("current");
    if (dir && !REDUCED) {
      el.style.transform = `translateX(${dir * 100}%)`;
      el.getBoundingClientRect();              // force reflow so the transition runs
      el.style.transform = "";
      old.style.transform = `translateX(${-dir * 100}%)`;
      setTimeout(() => old.remove(), 260);
    } else old.remove();
  }
  $("#title").textContent = v.title;
  $("#bBack").hidden = stack.length < 2;
  if (v.kind === "menu") syncSel(true);
  else say(v.title + ". " + el.textContent.slice(0, 300));
  if (v.kind === "now") { updateProgress(); fitMarquee(); }
  startViz();
}
const refresh = () => { if (topView()) show(0); };

/** Highlight the selected row and, on wide screens, show its preview on the right */
let paneItem = null;
function syncSel(force) {
  const v = topView(), list = v.el, it = v.items[v.sel];
  let cur = null;
  list.querySelectorAll("li[data-i]").forEach(li => {
    const on = +li.dataset.i === v.sel;
    li.classList.toggle("sel", on);
    if (on) { li.setAttribute("aria-current", "true"); cur = li; } else li.removeAttribute("aria-current");
  });
  if (cur) {
    const t = cur.offsetTop, b = t + cur.offsetHeight;
    if (t < list.scrollTop) list.scrollTop = t;
    else if (b > list.scrollTop + list.clientHeight) list.scrollTop = b - list.clientHeight;
  }
  say(`${v.title}: ${it.label}`);
  if (WIDE.matches && (force || paneItem !== it)) renderPane(it);
}
function renderPane(it) {
  paneItem = it;
  const s = !it.preview && it.open ? it.open() : null;
  const nodes = it.preview ? it.preview() : s && s.kind !== "menu" ? [RENDER[s.kind](s)] : [];
  pane.textContent = "";
  const wrap = h("article", { class: "detail" });            // loose nodes share the page styling
  for (const n of nodes.flat(Infinity).filter(Boolean)) {
    if (n.tagName === "ARTICLE") pane.append(n);
    else { if (!wrap.isConnected) pane.append(wrap); wrap.append(n); }
  }
  pane.scrollTop = 0;
  if (np && np.root.isConnected) { updateProgress(); fitMarquee(); }
  startViz();
}
function fitMarquee() {
  if (!np || !np.root.isConnected) return;
  const over = np.title.firstChild.offsetWidth - np.title.clientWidth;
  np.title.classList.toggle("scroll", over > 2);
  np.title.style.setProperty("--shift", -over + "px");
}
let seeking = false;
function updateProgress() {
  const d = audio.duration, t = audio.currentTime || 0, ok = state.cur >= 0 && isFinite(d) && d > 0;
  const pct = ok ? t / d * 100 : 0;
  if (!seeking) tp.seek.value = pct * 10;
  tp.time.textContent = fmt(t);
  if (!np || !np.root.isConnected) return;
  np.fill.style.width = pct + "%";
  np.fill.parentNode.setAttribute("aria-valuenow", Math.round(pct));
  np.el.textContent = fmt(t);
  np.rem.textContent = ok ? "-" + fmt(d - t) : "-:--";
}
const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>'
};
/** Status-bar icons and the transport bar */
function updateStatus() {
  const loaded = state.cur >= 0 && !state.bad, playing = loaded && !audio.paused;
  let s = "";
  if (loaded) s += playing ? ICON.play : ICON.pause;
  if (state.shuffle) s += " <small>SHF</small>";
  if (state.repeat !== "off") s += ` <small>${state.repeat === "one" ? "RP1" : "RPT"}</small>`;
  $("#stIcons").innerHTML = s;
  tp.play.innerHTML = playing ? ICON.pause : ICON.play;
  tp.title.textContent = state.cur < 0 ? "Nothing playing" : state.bad ? "Track unavailable" : `${track().title} - ${track().artist}`;
  tp.seek.disabled = !loaded;
}

/* =====================================================================
   Navigation
   ===================================================================== */
function push(v) { stack.push(v); show(1); }
function back() { if (stack.length > 1) { stack.pop(); show(-1); } }
/** Enter / click on a menu row */
function activate(it) {
  if (it.act) return it.act();
  const s = it.open();
  if (s.kind === "menu" || !WIDE.matches) return push(s);    // content pages only open full-width on narrow screens
  if (s.kind === "now") togglePlay();                        // on wide screens the page is already in the preview
  else if (s.action) s.action.run();
}
/** Up / Down */
function tick(dir) {
  const v = topView();
  blip();
  if (v.kind === "menu") {
    const s = clamp(v.sel + dir, 0, v.items.length - 1);
    if (s !== v.sel) { v.sel = s; syncSel(); }
  } else if (v.kind === "now" && state.cur >= 0) setVolume(state.volume - dir * 0.05);
  else scrollText(v, dir);
}
/** Smoothly scroll a text screen one notch; quick successive presses add up instead of cancelling */
function scrollText(v, dir) {
  const el = v.el, now = performance.now();
  const base = now - (v.lastTick || 0) < 400 ? v.target : el.scrollTop;
  v.target = clamp(base + dir * el.clientHeight * 0.3, 0, el.scrollHeight - el.clientHeight);
  v.lastTick = now;
  el.scrollTo({ top: v.target, behavior: REDUCED ? "auto" : "smooth" });
}
function center() {
  const v = topView();
  if (v.kind === "menu") activate(v.items[v.sel]);
  else if (v.kind === "now") togglePlay();
  else if (v.action) v.action.run();
}
/** Easter egg: double-click the title to jump to a random project */
function randomProject() {
  const i = Math.floor(Math.random() * DATA.projects.length);
  jump(projectsMenu, i);
  if (!WIDE.matches) push(projectScreen(DATA.projects[i], i));
  overlay("Shuffle!");
}

/* ---- Buttons ---- */
$("#bBack").addEventListener("click", back);
$("#bPrev").addEventListener("click", prevTrack);
$("#bNext").addEventListener("click", () => nextTrack(false));
tp.play.addEventListener("click", togglePlay);
$("#title").addEventListener("dblclick", randomProject);
tp.vol.addEventListener("input", () => setVolume(+tp.vol.value, false));
tp.seek.addEventListener("pointerdown", () => { seeking = true; });
tp.seek.addEventListener("input", () => { if (isFinite(audio.duration)) audio.currentTime = tp.seek.value / 1000 * audio.duration; });
tp.seek.addEventListener("change", () => { seeking = false; });
window.addEventListener("pointerup", () => { seeking = false; });

/* ---- Keyboard ---- */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || document.body.classList.contains("plain")) return;
  if (e.target.matches && e.target.matches("input")) return;         // sliders handle their own keys
  const onControl = e.target.closest && e.target.closest("button, a");
  const now = topView().kind === "now";
  switch (e.key) {
    case "ArrowUp": tick(-1); break;
    case "ArrowDown": tick(1); break;
    case "ArrowLeft": if (now) prevTrack(); else back(); break;
    case "ArrowRight": if (now) nextTrack(false); else center(); break;
    case "Enter": if (onControl) return; center(); break;             // focused buttons handle Enter themselves
    case " ": if (onControl) return; togglePlay(); break;
    case "Escape": case "Backspace": back(); break;
    default: return;
  }
  e.preventDefault();
});

/* Audio may only start after a real user gesture */
for (const ev of ["pointerdown", "keydown"]) window.addEventListener(ev, () => { armed = true; }, { capture: true });

/* Switching between wide and narrow layouts */
WIDE.addEventListener("change", () => {
  while (WIDE.matches && stack.length > 1 && topView().kind !== "menu") stack.pop();   // pages live in the preview when wide
  paneItem = null; refresh();
});
window.addEventListener("resize", fitMarquee);

/* =====================================================================
   Plain view, status bar clock + battery, boot
   ===================================================================== */
function setPlain(on) {
  document.body.classList.toggle("plain", on);
  $("#fallback").classList.toggle("sr-only", !on);
  if (on) { if (location.hash !== "#plain") history.replaceState(null, "", "#plain"); window.scrollTo(0, 0); }
  else if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
$("#bPlain").addEventListener("click", () => setPlain(true));
$("#bPlayer").addEventListener("click", () => setPlain(false));
window.addEventListener("hashchange", () => setPlain(location.hash === "#plain"));

function tickClock() {
  $("#clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]\.?M\.?/i, "");
}
if (navigator.getBattery) navigator.getBattery().then(b => {
  const u = () => { $("#batt").style.width = Math.round(b.level * 100) + "%"; };
  u(); b.addEventListener("levelchange", u);
}).catch(() => {});

/** Plain copy of all content, built from DATA. Hidden for screen readers and crawlers until Plain view shows it. */
function buildFallback() {
  const L = DATA.links, sec = (t, ...k) => h("section", null, h("h2", { text: t }), ...k);
  const rows = list => h("ul", null, list.map(a => h("li", { text: a.title + (when(a) ? ` (${when(a)})` : "") + (a.desc ? ": " + a.desc : "") })));
  $("#fallback").append(
    h("h1", { text: DATA.name }),
    h("p", { text: `${DATA.about.role}. ${DATA.about.bio.join(" ")}` }),
    h("p", null, h("a", { href: L.resume, text: "Resume (PDF)" }), " | ", h("a", { href: L.linkedin, text: "LinkedIn" }), " | ",
      h("a", { href: L.github, text: "GitHub" }), " | ", h("a", { href: "mailto:" + L.email, text: L.email })),
    sec("Projects", DATA.projects.map(p => h("article", null,
      h("h3", { text: p.title }),
      h("p", { text: `${p.album}, ${p.date}. ${p.artist}.` }), h("p", { text: p.desc }),
      h("ul", null, p.highlights.map(x => h("li", { text: x }))),
      isUrl(p.link) ? h("p", null, h("a", { href: p.link, text: p.linkLabel || "Live demo" }), p.linkNote ? " " + p.linkNote : "") : null))),
    sec("Education", DATA.about.education.map(a => [h("h3", { text: a.title }), h("p", { text: `${when(a)}. ${a.desc}` }),
      a.notes.length ? h("p", { text: "Relevant coursework: " + a.notes.join("; ") + "." }) : null])),
    sec("Awards", rows(DATA.awards)),
    sec("Leadership", rows(DATA.leadership)),
    sec("Skills", h("ul", null, Object.entries(DATA.skills).map(([c, l]) => h("li", { text: `${c}: ${l.join(", ")}` })))));
}

applyTheme();
buildFallback();
tickClock(); setInterval(tickClock, 15000);
stack.push(mainMenu());
show(0);
updateStatus();
setPlain(location.hash === "#plain");
// Count one visit per browser session
try { if (!sessionStorage.getItem("mp3_seen")) { sessionStorage.setItem("mp3_seen", "1"); hit("view"); } } catch (e) { hit("view"); }
</script>
</body>
